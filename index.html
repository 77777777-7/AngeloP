<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">

<title>휴대폰</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
input,textarea{user-select:text}
body{background:#d9dbe0;min-height:100dvh;display:grid;place-items:center;font-family:-apple-system,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#phone{width:390px;height:min(844px,96dvh);border:10px solid #111;border-radius:56px;overflow:hidden;position:relative;background:#000;box-shadow:0 20px 60px #0004}
@media(max-width:500px){body{display:block}#phone{width:100vw;height:100dvh;border:0;border-radius:0}}
#screen{position:absolute;inset:0;overflow:hidden;color:#fff}
#status{position:absolute;top:0;left:0;right:0;height:50px;padding:16px 30px 0;display:flex;justify-content:space-between;font-size:15px;font-weight:600;z-index:30;pointer-events:none}
.inapp #status{color:#000}
#island{position:absolute;top:11px;left:50%;width:110px;height:32px;margin-left:-55px;background:#000;border-radius:20px;z-index:31}
#home{position:absolute;inset:0;padding:70px 20px 0;transform:scale(1.18);filter:blur(8px);transition:.55s cubic-bezier(.2,.8,.2,1)}
.unlocked #home{transform:none;filter:none}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 0}
.ic{text-align:center;font-size:11px;text-shadow:0 1px 3px #0006;cursor:pointer}
.ic i{display:grid;place-items:center;width:60px;height:60px;margin:0 auto 5px;border-radius:14px;font-size:30px;font-style:normal;text-shadow:none}
.ic:active i{filter:brightness(.7)}
#dock{position:absolute;bottom:24px;left:12px;right:12px;height:90px;border-radius:34px;background:#fff3;backdrop-filter:blur(20px);display:flex;justify-content:space-around;align-items:center}
#dock .ic span{display:none}#dock .ic i{margin:0}
#lock{position:absolute;inset:0;z-index:20;text-align:center;padding:110px 24px 0;transition:transform .5s cubic-bezier(.2,.8,.2,1);touch-action:none}
.pass #lock{transform:translateY(-100%)}
#ld{font-size:19px;font-weight:500}#lt{font-size:92px;font-weight:600;line-height:1.1}
#note{margin-top:40px;text-align:left;background:#fff3;backdrop-filter:blur(20px);border-radius:20px;padding:12px 16px;font-size:14px}
#note b{display:block;font-size:15px}
#hint{position:absolute;bottom:42px;left:0;right:0;font-size:13px;opacity:.8}
#pass{position:absolute;inset:0;z-index:18;background:#0005;backdrop-filter:blur(30px);text-align:center;padding-top:100px;transition:opacity .4s}
.unlocked #pass{opacity:0;pointer-events:none}
#dots{display:flex;gap:18px;justify-content:center;margin:26px 0 34px}
#dots i{width:13px;height:13px;border:1.5px solid #fff;border-radius:50%}#dots i.f{background:#fff}
#keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;justify-content:center}
#keys b,.kp b{display:grid;place-items:center;height:76px;border-radius:50%;background:#fff3;font-size:30px;font-weight:400;cursor:pointer}
#keys b:active,.kp b:active{background:#fff8}
#pass u{position:absolute;bottom:50px;right:50px;font-size:16px;text-decoration:none;cursor:pointer}
#app{position:absolute;inset:0;z-index:10;background:#f2f2f7;color:#000;display:flex;flex-direction:column;transform:scale(.15);opacity:0;pointer-events:none;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .25s;border-radius:44px;overflow:hidden}
.open #app{transform:none;opacity:1;pointer-events:auto}
#nav{display:flex;align-items:center;justify-content:space-between;padding:52px 16px 8px;font-size:17px;min-height:96px}
#nav span{color:#0a84ff;width:80px;cursor:pointer}#act{text-align:right;font-size:26px}#nav b{flex:1;text-align:center}
#body{flex:1;overflow:auto;padding:0 16px}#body::after{content:"";display:block;height:34px}
h2{margin:4px 4px 12px}.sub{text-align:center;color:#8e8e93;margin-bottom:12px}
ul{list-style:none;background:#fff;border-radius:12px;overflow:hidden}
li{padding:12px 16px;border-bottom:1px solid #eee;cursor:pointer}li:last-child{border:0}
li b{display:flex;justify-content:space-between;align-items:center;font-size:16px}em{font-style:normal;font-weight:400;color:#8e8e93;font-size:13px}
li small{color:#8e8e93;font-size:14px;display:block;margin-top:2px}
.card{background:#fff;border-radius:12px;padding:16px;font-size:16px;line-height:1.5;white-space:pre-wrap}
.msg{width:fit-content;max-width:75%;padding:8px 13px;border-radius:18px;margin:5px 0;font-size:16px;line-height:1.35;white-space:pre-wrap}
.me{background:#0a84ff;color:#fff;margin-left:auto}.them{background:#e5e5ea}
.in{position:sticky;bottom:26px;display:flex;gap:8px;margin-top:10px}
.in input{flex:1;border:1px solid #ccc;border-radius:20px;padding:9px 14px;font-size:16px;outline:0}
.in b{width:36px;height:36px;border-radius:50%;background:#0a84ff;color:#fff;display:grid;place-items:center;cursor:pointer}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pg div,.big{aspect-ratio:1;background:#d8d8de;display:grid;place-items:center;font-size:11px;color:#777;cursor:pointer}

.seg{display:flex;background:#e3e3e8;border-radius:9px;padding:2px;margin-bottom:12px}

.kp{display:grid;grid-template-columns:repeat(3,76px);gap:12px 20px;justify-content:center}

.cb{display:flex;justify-content:center;align-items:center;gap:30px;margin-top:14px}

.av{width:90px;height:90px;border-radius:50%;background:#a5a5ad;color:#fff;font-size:40px;display:grid;place-items:center;margin:6px auto 10px}
.url{background:#e3e3e8;border-radius:10px;padding:10px 14px;font-size:15px;color:#555;margin-bottom:14px}
.art{width:70%;aspect-ratio:1;margin:6px auto 16px;border-radius:14px;background:linear-gradient(135deg,#fc3c44,#7b2ff7);display:grid;place-items:center;font-size:70px;box-shadow:0 10px 30px #0003}
.pr{height:5px;background:#d1d1d6;border-radius:3px;margin:10px 0 14px}#pb{height:100%;width:0;background:#8e8e93;border-radius:3px}
.ctl{display:flex;justify-content:center;gap:34px;font-size:34px;margin-bottom:16px}.ctl i{font-style:normal;cursor:pointer}
.ti{width:100%;border:0;background:transparent;font-size:24px;font-weight:700;outline:0;margin-bottom:8px}
.ta{width:100%;height:60vh;border:0;background:transparent;font-size:17px;line-height:1.5;outline:0;resize:none}
.mh{display:flex;justify-content:space-between;font-size:18px;font-weight:600;margin:0 4px 10px}.mh b{color:#0a84ff;padding:0 10px;cursor:pointer}
.cg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:6px 0;font-size:16px}
.cg em{font-size:12px}.d{height:38px;line-height:30px;cursor:pointer;position:relative}.d.sel{background:#0a84ff;color:#fff;border-radius:50%;width:34px;height:34px;margin:0 auto}
.d i{position:absolute;bottom:-4px;left:0;right:0;color:#ff3b30;font-style:normal;line-height:6px}
.map{position:relative;height:300px;border-radius:14px;margin-bottom:14px;background:repeating-linear-gradient(0deg,#0000 0 39px,#fff8 39px 41px),repeating-linear-gradient(90deg,#0000 0 39px,#fff8 39px 41px),#cfe8c8}
.map i{position:absolute;font-style:normal;font-size:28px;transform:translate(-50%,-100%);cursor:pointer}
.vf{position:relative;height:470px;border-radius:20px;background:#000;color:#999;display:grid;place-items:center;text-align:center;padding:20px;overflow:hidden}
#fl{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .2s}
.sh{width:70px;height:70px;border-radius:50%;border:5px solid #ccc;background:#fff;margin:16px auto 0;cursor:pointer}.sh:active{background:#ddd}
.wx{background:linear-gradient(#4a90e2,#7ab8f5);color:#fff;border-radius:20px;padding:24px;text-align:center;margin-bottom:12px}.wx h1{font-size:72px;font-weight:200}
.hr{display:flex;gap:18px;overflow:auto;background:#fff;border-radius:12px;padding:12px 16px;margin-bottom:12px;text-align:center;font-size:14px;line-height:1.7}
.ck{font-size:64px;font-weight:200;text-align:center;margin:8px 0 18px}
.sw{width:46px;height:28px;border-radius:14px;background:#d1d1d6;position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:#34c759}.sw.on::after{left:20px}
.cw{background:#000;border-radius:24px;padding:16px}#cdp{color:#fff;font-size:56px;font-weight:300;text-align:right;height:90px;line-height:90px;overflow:hidden}
.kp.c{grid-template-columns:repeat(4,1fr);gap:10px}.kp.c b{height:70px;border-radius:35px;font-size:28px;background:#333;color:#fff}
.kp.c b:nth-child(4n){background:#ff9f0a}.kp.c b:nth-child(-n+3){background:#a5a5a5;color:#000}.kp.c b:nth-child(17){grid-column:span 2;border-radius:35px}
#bar{position:absolute;bottom:0;left:0;right:0;height:30px;z-index:40;cursor:pointer;touch-action:none}
#bar::after{content:"";position:absolute;bottom:8px;left:50%;width:134px;margin-left:-67px;height:5px;border-radius:3px;background:#fff}
.inapp #bar::after{background:#000}

/* ---- 유리(글래스) 느낌 ---- */
#app{background:radial-gradient(circle at 12% 8%,#bcd3ff,#0000 42%),radial-gradient(circle at 92% 62%,#ffc9e3,#0000 45%),radial-gradient(circle at 20% 95%,#c5f0e0,#0000 40%),#f2f2f7}
#nav{position:absolute;top:0;left:0;right:0;z-index:3;background:#fff7;backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border-bottom:1px solid #fff9;box-shadow:0 1px 12px #0001}
#body{padding:104px 16px 0}
ul,.card,.hr{background:#fff8;backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid #fffa;border-radius:18px;box-shadow:0 6px 24px #0000000d}
li{border-bottom-color:#0000000f}
.seg{background:#0000000d}.seg u.on{background:#fffd;box-shadow:0 1px 5px #0002}
.them{background:#fffc;border:1px solid #fff}.me{background:linear-gradient(#37a5ff,#0a84ff)}
.in input{background:#fffa;backdrop-filter:blur(14px)}
.kp b{background:#fff9;border:1px solid #fffb;box-shadow:0 4px 14px #0000001a}
.kp.c b{border:0;box-shadow:none}
.ic i{box-shadow:inset 0 1px 1px #fffa,inset 0 -6px 10px #0002,0 4px 12px #0003}
#dock{background:#fff4;backdrop-filter:blur(28px) saturate(180%);border:1px solid #fff5;box-shadow:inset 0 1px 1px #fff7,0 10px 30px #0003}
#note{border:1px solid #fff4;box-shadow:inset 0 1px 1px #fff5}
#keys b{border:1px solid #fff4;backdrop-filter:blur(8px)}
/* ---- 전화 화면 ---- */
#call{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;padding:96px 24px 50px;color:#fff;text-align:center;background:radial-gradient(circle at 30% 12%,#5b6bb5,#0000 55%),radial-gradient(circle at 85% 88%,#b05a8a,#0000 50%),#12141f;opacity:0;pointer-events:none;transition:opacity .35s}
.calling #call{opacity:1;pointer-events:auto}
.calling #status{color:#fff}.calling #bar::after{background:#fff}
#cn{font-size:36px;font-weight:500}#cs{margin-top:6px;font-size:18px;opacity:.7}
#sb{flex:1;display:grid;place-items:center;width:100%}
#sb span{max-width:310px;font-size:21px;line-height:1.55;font-weight:500;background:#0004;backdrop-filter:blur(14px);border:1px solid #fff3;border-radius:20px;padding:12px 18px;transition:opacity .3s}
#sb span:empty{opacity:0}
#cg,#ce,#ci{display:none}
#cg{grid-template-columns:repeat(3,76px);gap:18px 26px;margin-bottom:38px}
.gb{display:grid;place-items:center;height:76px;border-radius:50%;background:#fff3;border:1px solid #fff4;backdrop-filter:blur(12px);font-size:28px;cursor:pointer;position:relative;box-shadow:inset 0 1px 1px #fff5}
.gb small{position:absolute;bottom:-20px;font-size:12px;white-space:nowrap}.gb.on{background:#fffd;color:#000}
.rb{place-items:center;width:76px;height:76px;border-radius:50%;font-size:32px;cursor:pointer;display:grid;box-shadow:inset 0 1px 1px #fff7,0 6px 20px #0004}
.rb.r{background:#ff3b30}.rb.g{background:#34c759}.rb.r span{transform:rotate(135deg)}
.rw{display:grid;gap:10px;justify-items:center;font-size:14px}
#call.out #cg{display:grid}#call.out #ce{display:grid}#call.in #ci{display:flex;width:100%;justify-content:space-around}
/* ---- 전화 앱 하단 탭 ---- */
#tb{position:absolute;bottom:0;left:0;right:0;z-index:3;display:flex;padding:8px 4px 26px;background:#fff7;backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border-top:1px solid #fff9;box-shadow:0 -1px 12px #0001}
#tb:empty{display:none}
#tb div{flex:1;text-align:center;font-size:10px;color:#8e8e93;cursor:pointer}
#tb div b{display:block;font-size:22px;font-weight:400;filter:grayscale(1);opacity:.7;margin-bottom:2px}
#tb div.on{color:#0a84ff}#tb div.on b{filter:none;opacity:1}
/* ---- 상태바 / 시계 ---- */
#sr{display:flex;gap:6px;align-items:center}#sr img{height:13px}
.bat{position:relative;display:block;width:25px;height:12px;border:1px solid currentColor;border-radius:4px;padding:1px;opacity:.9}
.bat i{display:block;height:100%;border-radius:2px;background:currentColor}
.bat::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;border-radius:0 2px 2px 0;background:currentColor}
#al{position:absolute;top:56px;left:10px;right:10px;z-index:35;display:none;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:24px;background:#222c;backdrop-filter:blur(28px);border:1px solid #fff3;color:#fff;box-shadow:0 10px 30px #0005}
.alon #al{display:flex}#al u{background:#ff9f0a;border-radius:16px;padding:8px 16px;text-decoration:none;cursor:pointer;font-weight:600}
.sl{display:grid;gap:8px;margin-bottom:6px}.sl>b{display:flex;justify-content:space-between;align-items:center}
.sr{display:flex;gap:12px}.sr label{flex:1;font-size:13px;color:#8e8e93}
input[type=time]{display:block;font-size:24px;border:0;background:transparent;font-family:inherit;outline:0}
.fr{display:flex;justify-content:space-between;align-items:center;padding:6px 0}.fr input{font-size:17px;border:0;background:transparent;text-align:right;outline:0;font-family:inherit}
.bg2{font-size:66px;font-weight:200;text-align:center;margin:22px 0;font-variant-numeric:tabular-nums}
.cw2{display:flex;justify-content:space-between;margin:0 6px 22px}
.cr{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:#fff9;border:1px solid #fffb;font-size:17px;cursor:pointer;box-shadow:0 4px 14px #0000001a}
.cr.g{background:#34c75933;color:#1a9a3b}.cr.r{background:#ff3b3033;color:#e0261b}

<script>
/* ============================================================
   ★ "수정 구역" 시작 ★  따옴표(" ") 안의 글자만 바꾸세요.
   - (여기에 ... 입력) 부분을 지우고 원하는 내용으로 바꾸면 됩니다.
   - 따옴표·쉼표·중괄호 { } [ ] 는 지우지 마세요. type 은 바꾸지 마세요.
   - 항목을 늘리려면 { ... }, 한 덩어리를 복사해서 바로 뒤에 붙이세요.
   - img: "" → 앱 아이콘 이미지. 인터넷 주소(https://...) 또는
     이 파일과 같은 폴더에 둔 이미지 파일 이름(예: "msg.png")을 넣으세요. 비우면 기본 아이콘.
   - 화면 위쪽 카메라 구멍(다이나믹 아일랜드)을 누르면 다시 잠깁니다.
   ============================================================ */
const PHONE = {
  time: "",        // 상단 시계. 예: "9:41" / 비우면 실제 시간
  today: "",       // 달력 기준 날짜. 예: "2026-10-18" / 비우면 오늘
  lockDate: "10월 19일",
  lockNotice: { title: "메시지 · 스코필드 형사", text: "너무 늦는다 싶으면 먼저 드십시오." },
  wallpaper: "linear-gradient(160deg,#e3e3e3,#4f4f4f)",  // 배경: 색 또는 url('이미지주소')
  /* ★ 아이콘 이미지 바꾸기: 따옴표 안에 이미지 주소(또는 같은 폴더의 파일 이름)를 넣으면 기본 아이콘 대신 그 이미지가 나옵니다. 비우면 기본 아이콘. */
  icons: {
    call: "",      // 통화(수락) 버튼, 키패드 통화 버튼, 연락처 통화 버튼  ← 여기 이미지를 넣으세요
    end: "",       // 통화 종료·거절 버튼                                   ← 여기 이미지를 넣으세요
    star: "",      // 전화 앱 '즐겨찾기' 탭                                 ← 여기 이미지를 넣으세요

 settings:()=>`<g fill="#d8d8dc"><circle cx="30" cy="30" r="14"/>${R(8,i=>`<rect x="26.500" y="9" width="7" height="12" rx="2" transform="rotate(${i*45} 30 30)"/>`)}</g><circle cx="30" cy="30" r="7" fill="#8e8e93"/>`
};
const HI=a=>`<svg viewBox="0 0 60 60">${HG[a.type]?HG[a.type]():`<text x="30" y="40" text-anchor="middle" font-size="30" font-weight="600" fill="#fff">${E(a.name[0])}</text>`}</svg>`;
const ico=a=>`<div class="ic" onclick="openApp('${a.name}',this)"><i style="${a.img?U(a.img):'background:'+a.color}">${a.img?'':HI(a)}</i><span>${E(a.name)}</span></div>`;
$('#home').style.background=P.wallpaper;L.style.background=P.wallpaper;
$('#grid').innerHTML=P.apps.filter(a=>!P.dock.includes(a.name)).map(ico).join('');
$('#dock').innerHTML=P.dock.map(n=>ico(P.apps.find(a=>a.name==n))).join('');
$('#ld').textContent=P.lockDate;$('#note').innerHTML=`<b>${E(P.lockNotice.title)}</b>${E(P.lockNotice.text)}`;
$('#keys').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<b onclick="pk('${k}')" style="${k===''?'visibility:hidden':''}">${k=='⌫'?ic('backspace'):`<span>${k}</span><small>${(KP.find(x=>x[0]==k)||[0,''])[1]}</small>`}</b>`).join('');
$('#cg').innerHTML=[['mute','음소거'],['keypad','키패드'],['speaker','스피커'],['plus','통화 추가'],['video','FaceTime'],['person','연락처']].map(g=>`<div class="gb" onclick="this.classList.toggle('on')">${ic(g[0])}<small>${g[1]}</small></div>`).join('');
$('#ce').innerHTML=ic('end');
$('#ci').innerHTML=`<div class="rw"><div class="rb r" onclick="hang()">${ic('end')}</div>거절</div><div class="rw"><div class="rb g" onclick="accept()">${ic('call')}</div>수락</div>`;
tick();setInterval(tick,15000);

function dots(){[...document.querySelectorAll('#dots i')].forEach((d,i)=>d.className=i<pw.length?'f':'')}
function pk(k){if(k=='⌫')pw=pw.slice(0,-1);else if(k!=='')pw+=k;dots();if(pw.length==4)setTimeout(()=>{Q.classList.add('unlocked');pw='';dots()},200)}
const st=()=>Q.classList.contains('unlocked')?(Q.classList.contains('open')?'app':'home'):Q.classList.contains('pass')?'pass':'lock';
$('#island').onclick=()=>{closeApp();Q.classList.remove('pass','unlocked');pw='';dots()};

[$('#bar'),L].forEach(el=>{let y0=null;
 el.onpointerdown=e=>{y0=e.clientY;el.setPointerCapture(e.pointerId)};
 el.onpointermove=e=>{if(y0===null)return;const d=Math.min(0,e.clientY-y0),s=st();
  if(s=='lock'){L.style.transition='none';L.style.transform=`translateY(${d}px)`}
  if(s=='app'){AP.style.transition='none';AP.style.transform=`scale(${1+d/900}) translateY(${d/4}px)`}};
 el.onpointerup=e=>{if(y0===null)return;const d=e.clientY-y0,s=st();y0=null;L.style.transition=AP.style.transition='';L.style.transform=AP.style.transform='';
  if(d<-60||Math.abs(d)<6){if(s=='lock')Q.classList.add('pass');else if(s=='app')closeApp()}}});

function openApp(n,el){A=find0(n);S=null;pc=null;tab=A.type=='clock'?'alarm':'keys';draw();
 if(el){const r=el.getBoundingClientRect(),s=Q.getBoundingClientRect();AP.style.transformOrigin=`${r.left-s.left+r.width/2}px ${r.top-s.top+r.height/2}px`}
 Q.classList.add('open','inapp')}
const find0=n=>P.apps.find(a=>a.name==n);
function closeApp(){Q.classList.remove('open','inapp');clearInterval(mt)}
function back(){if(A.type=='phone'&&pc!==null){pc=null;draw()}else if(S!==null){S=null;draw()}else closeApp()}
function sub(j){S=j;draw()}
function add(){S=V[A.type].add(A);draw()}
function tg(j){A.items[j].on=!A.items[j].on;draw()}
const TL={favs:'즐겨찾기',rec:'최근 통화',con:'연락처',keys:'키패드',alarm:'알람',sw:'스톱워치',tm:'타이머'};
const TABS={phone:[['favs','star','즐겨찾기'],['rec','recent','최근 통화'],['con','person','연락처'],['keys','keypad','키패드'],['vm','vm','음성 사서함']],
 clock:[['world','globe','세계 시계'],['alarm','alarm','알람'],['sw','stopwatch','스톱워치'],['tm','timer','타이머']]};
const OFF=['vm','world'];   /* 음성 사서함·세계 시계 탭은 일부러 눌러도 열리지 않게 함 */
const tabs=()=>TABS[A.type].map(t=>`<div class="${tab==t[0]?'on':''}" ${OFF.includes(t[0])?'':`onclick="tab='${t[0]}';pc=null;draw()"`}><b>${ic(t[1])}</b>${t[2]}</div>`).join('');
function draw(){clearInterval(mt);mp=0;const x=S!==null?A.items[S]:null,v=V[A.type],tb=TABS[A.type],px=A.type=='phone'&&pc!==null?find('contacts').items[pc]:null,ad=v.add&&(A.type!='clock'||tab=='alarm');
 $('#ttl').textContent=x?(x.name||x.t||''):px?px.t:tb?TL[tab]||'':A.name;$('#back').textContent=px?'‹ 연락처':x?'‹ '+A.name:'‹ 홈';
 $('#act').textContent=!x&&ad?'＋':'';$('#body').innerHTML=x?v.d(x):v.l(A);$('#tb').innerHTML=tb?tabs():'';$('#body').style.paddingBottom=tb?'96px':'';
 $('#body').scrollTop=A.type=='chat'&&x?9e4:0;tick()}

function send(){const i=$('#mi'),v=i.value.trim(),x=A.items[S],s=S;if(!v)return;x.msgs.push(['me',v]);draw();$('#mi').focus();
 if(x.call&&!x._c){x._c=1;setTimeout(()=>{if(!C)begin({name:x.name,dir:'in',ph:'in',ringSec:x.call.ringSec||20,sc:x.call.script||[],end:x.call.end||30})},(x.callAfter||5)*1000)}
 if(x.replies&&x.replies.length)setTimeout(()=>{x.msgs.push(['them',x.replies[(x.n||0)%x.replies.length]]);x.n=(x.n||0)+1;if(S===s&&A.items[S]===x)draw()},1200)}
function play(){const x=A.items[S];if(x&&x.link)window.open(x.link,'_blank','noopener')}
function shoot(){const f=$('#fl');f.style.opacity=1;setTimeout(()=>f.style.opacity=0,150);find('photos').items.unshift({src:'',cap:'방금 찍은 사진'})}
const mmss=e=>String(Math.floor(e/60)).padStart(2,'0')+':'+String(Math.floor(e%60)).padStart(2,'0');
function call(n){if(!n||C)return;const c=findC(n),v=P.voicemail;
 begin({name:c?c.t:n,dir:'out',ph:'ring',rings:(c&&c.answer&&c.answer.rings)||v.rings,ringSec:v.ringSec,ans:c&&c.answer})}
function begin(o){clearTimeout(ft);C=o;C.t0=Date.now();$('#cn').textContent=o.name;$('#st').textContent='';
 $('#call').className=o.dir=='in'?'in':'out';$('#cs').textContent=o.dir=='in'?'휴대전화':'발신 중...';
 Q.classList.add('calling');clearInterval(ci);ci=setInterval(loop,200)}
function accept(){if(!C)return;C.ph='live';C.t0=Date.now();$('#call').className='out'}
function loop(){if(!C)return;const e=(Date.now()-C.t0)/1000,v=P.voicemail;
 if(C.ph=='ring'){$('#st').textContent=v.ringText;if(e>=C.rings*C.ringSec){C.t0=Date.now();if(C.ans){C.ph='live';C.sc=C.ans.script;C.end=C.ans.end}else{C.ph='vm';C.sc=v.script;C.end=v.end}}return}
 if(C.ph=='in'){if(e>=C.ringSec)finish('부재중 전화');return}
 $('#cs').textContent=mmss(e);let t='';(C.sc||[]).forEach(s=>{if(e>=s.at)t=s.text});$('#st').textContent=t;
 if(e>=C.end)finish(C.dir=='in'?'수신 전화':'발신 전화')}
function hang(){if(C)finish(C.ph=='in'?'수신 거절':C.dir=='in'?'수신 전화':'발신 전화')}
function finish(l){if(!C)return;clearInterval(ci);const n=C.name;C=null;$('#call').className='';$('#st').textContent='';
 $('#cs').textContent=l=='부재중 전화'||l=='수신 거절'?l:'통화 종료';find('phone').items.unshift({t:n,s:l+' · 방금'});
 ft=setTimeout(()=>Q.classList.remove('calling'),1000);if(A&&A.type=='phone'&&S===null)draw()}
function ck(k){if(calc=='오류')calc='';
 if(k=='AC')calc='';else if(k=='=')try{calc=String(+(+Function('return '+calc.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-'))()).toFixed(8))}catch(e){calc='오류'}
 else if(k=='±')calc=calc[0]=='-'?calc.slice(1):'-'+calc;else if(k=='%')calc=String(parseFloat(calc)/100);else calc+=k;$('#cdp').textContent=calc||0}

/* ---------- 시계 앱 기능 ---------- */
const p2=n=>String(n).padStart(2,'0'),mi=t=>{const[a,b]=String(t).split(':');return +a*60+ +b};
const dur=s=>{const d=(mi(s.wake)-mi(s.bed)+1440)%1440;return Math.floor(d/60)+'시간 '+d%60+'분'};
const fm=t=>{const[a,b]=String(t).split(':');return (a<12?'오전 ':'오후 ')+((a%12)||12)+':'+b};
const sw={run:0,st:0,ac:0,laps:[]},tm={on:0,run:0,left:0,end:0,h:0,m:5,s:0};
const swT=()=>sw.ac+(sw.run?Date.now()-sw.st:0);
const fmt=ms=>p2(Math.floor(ms/60000))+':'+p2(Math.floor(ms/1000)%60)+'.'+p2(Math.floor(ms/10)%100);
const hms=ms=>{const t=Math.ceil(ms/1000);return p2(Math.floor(t/3600))+':'+p2(Math.floor(t/60)%60)+':'+p2(t%60)};
const tmL=()=>tm.run?tm.end-Date.now():tm.left;
Object.assign(tm,find('clock').timer||{});
function swH(){return `<div class="bg2" id="swd">${fmt(swT())}</div><div class="cw2"><div class="cr" onclick="swL()">${sw.run?'랩':'재설정'}</div><div class="cr ${sw.run?'r':'g'}" onclick="swS()">${sw.run?'정지':'시작'}</div></div><ul>${sw.laps.map((l,i)=>`<li><b>랩 ${sw.laps.length-i}<span>${fmt(l-(sw.laps[i+1]||0))}</span></b></li>`).join('')}</ul>`}
function swS(){if(sw.run){sw.ac+=Date.now()-sw.st;sw.run=0}else{sw.st=Date.now();sw.run=1}draw()}
function swL(){if(sw.run)sw.laps.unshift(swT());else{sw.ac=0;sw.laps=[]}draw()}
function tmH(){return tm.on?`<div class="bg2" id="tmd">${hms(tmL())}</div><div class="cw2"><div class="cr" onclick="tmC()">취소</div><div class="cr ${tm.run?'r':'g'}" onclick="tmP()">${tm.run?'일시정지':'재개'}</div></div>`
 :`<div class="tmi"><label>시간<input type="number" min="0" max="23" value="${tm.h}" onchange="tm.h=+this.value"></label><label>분<input type="number" min="0" max="59" value="${tm.m}" onchange="tm.m=+this.value"></label><label>초<input type="number" min="0" max="59" value="${tm.s}" onchange="tm.s=+this.value"></label></div><div class="cw2" style="justify-content:center"><div class="cr g" onclick="tmS()">시작</div></div>`}
function tmS(){tm.left=(tm.h*3600+tm.m*60+tm.s)*1000;if(tm.left<=0)return;tm.on=1;tm.run=1;tm.end=Date.now()+tm.left;draw()}
function tmP(){if(tm.run){tm.left=tm.end-Date.now();tm.run=0}else{tm.end=Date.now()+tm.left;tm.run=1}draw()}
function tmC(){tm.on=0;tm.run=0;draw()}
let al,lastA='';
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},600)}catch(e){}}
function ring(t,s){$('#at').textContent=t;$('#as').textContent=s||'';Q.classList.add('alon');clearInterval(al);beep();al=setInterval(beep,1300)}
function stopAl(){clearInterval(al);Q.classList.remove('alon')}
setInterval(()=>{const e=$('#swd');if(e&&sw.run)e.textContent=fmt(swT());
 if(tm.on&&tm.run){const l=tm.end-Date.now();if(l<=0){tm.on=0;tm.run=0;ring('타이머','시간이 다 되었습니다');if(A&&A.type=='clock'&&S===null)draw()}else{const d=$('#tmd');if(d)d.textContent=hms(l)}}
 const d=new Date(),n=p2(d.getHours())+':'+p2(d.getMinutes());if(n!=lastA){lastA=n;const c=find('clock');
  c.items.forEach(x=>{if(x.on&&x.t==n)ring('알람',x.s||fm(n))});if(c.sleep.on&&c.sleep.wake==n)ring('기상 알람',fm(n));if(c.sleep.on&&c.sleep.bed==n)ring('취침 시간',fm(n))}},100);

/* ---------- 상단 아이콘 ---------- */
const SB=P.statusBar||{},WF='<svg width="17" height="13" viewBox="0 0 17 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.5a10 10 0 0 1 14 0"/><path d="M4 7.4a6.5 6.5 0 0 1 9 0"/><circle cx="8.5" cy="10.6" r="1" fill="currentColor"/></svg>';
$('#sr').innerHTML=(SB.wifiImg?`<img src="${E(SB.wifiImg)}">`:WF)+(SB.batteryImg?`<img src="${E(SB.batteryImg)}">`:`<i class="bat"><i style="width:${SB.battery==null?80:SB.battery}%"></i></i>`);
</script>
